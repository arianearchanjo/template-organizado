<section id="error" class="erro-pagina" aria-labelledby="erro-titulo">
  <div class="pi-container">
    <div id="erro-conteudo" class="erro-conteudo" tabindex="-1">
      <div class="erro-icone" aria-hidden="true">
        <i class="fas fa-exclamation-triangle"></i>
      </div>

      <h1 id="erro-titulo">Ops! Algo deu errado.</h1>
      <h2>Página não localizada</h2>
      <p class="erro-descricao">
        O endereço pode estar incorreto ou a página pode ter sido movida.
      </p>

      <form action="/pesquisa" class="erro-busca" id="searchform" method="post" role="search">
        <label for="uid" class="sr-only">Buscar no portal</label>
        <div class="erro-busca-controle">
          <i class="fas fa-search erro-busca-icone" aria-hidden="true"></i>
          <input
            name="uid"
            id="uid"
            type="search"
            minlength="4"
            data-rule="minlen:4"
            data-msg="Digite no mínimo 4 caracteres"
            required
            title="Digite ao menos 4 caracteres para pesquisar"
            placeholder="O que você procura?"
            autocomplete="off">
          <button type="submit">
            <i class="fas fa-search" aria-hidden="true"></i>
            <span>Pesquisar</span>
          </button>
        </div>
        <p class="erro-busca-ajuda">Digite pelo menos 4 caracteres.</p>
      </form>

      <nav class="erro-atalhos" aria-label="Atalhos para continuar navegando">
        <a href="/inicio" class="erro-atalho erro-atalho--principal">
          <i class="fas fa-home" aria-hidden="true"></i>
          <span>Início</span>
        </a>
        <a href="/mapa-do-site" class="erro-atalho">
          <i class="fas fa-sitemap" aria-hidden="true"></i>
          <span>Mapa do site</span>
        </a>
        <a href="/contato" class="erro-atalho">
          <i class="fas fa-comments" aria-hidden="true"></i>
          <span>Fale conosco</span>
        </a>
      </nav>
    </div>
  </div>
</section>
