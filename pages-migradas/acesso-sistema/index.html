<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso ao Sistema - Prefeitura de Campina Grande do Sul</title>

  <script>
    // Define o caminho base para assets e links
    function getBasePath() {
      return "../../";
    }
    const base = getBasePath();
  </script>

  <!-- Bootstrap 4 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <!-- Estilos Globais -->
  <link rel="stylesheet" href="../../_global/css/index.css">
  <link rel="stylesheet" href="../../_global/css/acessibilidade.css">
  <link rel="stylesheet" href="css/acesso-sistema.css">

</head>
<body>
  <a href="#pi-conteudo" class="pi-skip-nav">Ir para o conteúdo principal</a>

  <barra-acessibilidade></barra-acessibilidade>
  <meu-search></meu-search>
  <meu-header></meu-header>

  <main id="pi-conteudo">
    <!-- HERO -->
  <section id="pi-hero" aria-label="Identificação da página">
    <div class="container">
      <div class="pi-hero-inner">
        <nav aria-label="Você está em">
          <ol class="pi-breadcrumb">
            <li><a href="../../index.html"><i class="fas fa-home" aria-hidden="true"></i> Início</a></li>
            <li aria-hidden="true"><span class="pi-breadcrumb-sep"><i class="fas fa-chevron-right"></i></span></li>
            <li aria-current="page">Acesso ao Sistema</li>
          </ol>
        </nav>
        <h1 class="pi-hero-titulo">Acesso ao Sistema</h1>
      </div>
    </div>
    <div class="pi-hero-ilustracao" aria-hidden="true">
      <img src="../../_global/img/global/ilustracao.png" alt="">
    </div>
  </section>


  <!-- LAYOUT PRINCIPAL -->
  <div id="conteudo-principal" class="pi-main" tabindex="-1">
    <div class="pi-container">
      <div class="login-container">

        <div class="login-card">
          <div class="login-header">
            <h2 class="login-titulo">
              <i class="fas fa-lock-open" aria-hidden="true"></i>
              Identificação
            </h2>
            <p class="login-subtitulo">Insira seus dados para iniciar a sessão</p>
          </div>

          <div class="login-body">
            <form action="/Account/Login/LoginPartial?ReturnUrl=%2Fhome" id="form-login" method="post" role="form">
              <div class="form-group">
                <label for="USER">Usuário</label>
                <div class="login-input-wrapper">
                  <span class="login-input-icon"><i class="fas fa-user"></i></span>
                  <input class="form-control" id="USER" name="USER" placeholder="Digite seu usuário" required="required" type="text">
                </div>
              </div>

              <div class="form-group">
                <label for="PASSWORD">Senha</label>
                <div class="login-input-wrapper">
                  <span class="login-input-icon"><i class="fas fa-lock"></i></span>
                  <input class="form-control" id="PASSWORD" name="PASSWORD" placeholder="Digite sua senha" required="required" type="password">
                </div>
              </div>

              <div class="login-actions">
                <button type="submit" class="btn-entrar">
                  <i class="fas fa-sign-in-alt" aria-hidden="true"></i>
                  Entrar no Sistema
                </button>
              </div>
            </form>
          </div>
        </div>

        <div class="login-info">
          <div class="info-bloco">
            <i class="fas fa-shield-halved" aria-hidden="true"></i>
            <div>
              <strong>Acesso Restrito</strong>
              <p>Este sistema é de uso exclusivo de servidores e pessoas autorizadas.</p>
            </div>
          </div>
          <div class="info-bloco">
            <i class="fas fa-circle-info" aria-hidden="true"></i>
            <div>
              <strong>Segurança</strong>
              <p>Mantenha sua senha em sigilo.</p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
  </main>

  <meu-footer></meu-footer>

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>

  <!-- Scripts Externos -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.bundle.min.js"></script>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

  <!-- Scripts Globais (Componentes) -->
  <script src="../../_global/js/acessibilidade-component.js"></script>
  <script src="../../_global/js/searh-component.js"></script>
  <script src="../../_global/js/header-component.js"></script>
  <script src="../../_global/js/footer-component.js"></script>

</body>
</html>
